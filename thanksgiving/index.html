<style>
:root {
  --cream: #F8EFE8; --paper: #FFFCF9; --red: #981F1F; --red-dark: #7A1818; --ink: #2A1B18; --muted: #77615B;

}
* { box-sizing: border-box; }

.wrap { max-width: 640px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right)) 140px max(16px, env(safe-area-inset-left)); }

.banner.warn { background: var(--gold-soft); color: #7A4B0E; }
nav.stores { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; overflow-x: auto; padding: 12px 0; margin: 10px 0 0;
  background: var(--cream); scrollbar-width: none; }
nav.stores::-webkit-scrollbar { display: none; }
nav.stores button { flex: 0 0 auto; font: 500 14px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line);
  border-radius: 999px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
nav.stores button[aria-current="true"] { background: var(--red); border-color: var(--red); color: #fff; }

.store-name { font-family: var(--display); font-size: 22px; margin: 18px 2px 4px; }

section.card.attn { border-color: var(--red); box-shadow: 0 0 0 3px rgba(152, 31, 31, .12); }
.step { display: flex; align-items: baseline; gap: 10px; margin: 0 0 6px; }
.step .n { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; background: var(--red); color: #fff; font: 600 14px/26px var(--body); text-align: center; transform: translateY(-2px); }
.step h2 { font-family: var(--display); font-weight: 400; font-size: 21px; line-height: 1.2; margin: 0; }
.sub { color: var(--muted); margin: 0 0 14px; font-size: 15px; }
.usual { margin: 0 0 16px; padding: 10px 12px; border-radius: 10px; background: var(--shade); font-size: 15px; }
.usual b { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { font-weight: 600; margin: 0 0 8px; padding: 0; }
.opts { display: grid; gap: 8px; }
.opt { position: relative; display: flex; gap: 12px; align-items: center; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 12px;
  background: #fff; cursor: pointer; transition: border-color .15s, background .15s; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .dot { flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #C9B3A8; display: grid; place-items: center; }
.opt .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: transparent; }
.opt .t { display: block; font-weight: 500; }
.opt .s { display: block; font-size: 13px; color: var(--muted); }
.opt:has(input:checked) { border-color: var(--red); background: #FFF7F4; }
.opt:has(input:checked) .dot { border-color: var(--red); }
.opt:has(input:checked) .dot::after { background: var(--red); }
.opt:has(input:focus-visible) { outline: 3px solid var(--gold); outline-offset: 2px; }
.opt.locked { cursor: default; opacity: .55; }
.grid-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
table.grid { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-variant-numeric: tabular-nums; }
table.grid th { font-weight: 600; font-size: 13px; line-height: 1.25; color: var(--ink); text-align: center; vertical-align: bottom; padding: 0 2px 4px; }
table.grid th small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
table.grid th.day, table.grid td.day { text-align: left; white-space: nowrap; }
table.grid td { text-align: center; padding: 0 2px; }
table.grid td.day { font-weight: 500; font-size: 15px; padding-right: 6px; }

.qty { width: 100%; max-width: 76px; min-width: 52px; height: 46px; font: 500 18px var(--body); text-align: center; color: var(--ink);
  background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 0 4px; -moz-appearance: textfield; }
.qty:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px rgba(152, 31, 31, .15); }
.qty.changed { background: var(--gold-soft); border-color: var(--gold); }
.qty:disabled { background: var(--shade); color: var(--muted); }
.qty::placeholder { color: #CDBAB0; }
.na { display: inline-block; width: 100%; max-width: 76px; height: 46px; line-height: 46px; color: #C9B3A8; }
.was { display: block; font-size: 11px; color: var(--muted); height: 14px; line-height: 14px; }
.addday { margin: 8px 0 0; }
.linkbtn { font: 500 14px var(--body); color: var(--red); background: none; border: 0; padding: 6px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.dayadd { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 500 15px var(--body); color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 999px; padding: 10px 16px; cursor: pointer; min-height: 44px; }
.chip[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
.chip:disabled { opacity: .45; cursor: default; }
.chip:focus-visible, .linkbtn:focus-visible, nav.stores button:focus-visible, .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.total { margin: 12px 0 0; padding: 10px 12px; background: var(--shade); border-radius: 10px; font-size: 14px; }
.total[hidden] { display: none; }
.lastyear { font-size: 14px; color: var(--muted); margin: 10px 0 0; }
.lastyear b { color: var(--ink); font-weight: 600; }
.note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
label.field { display: block; font-weight: 600; margin: 0 0 6px; }
textarea, input.text { width: 100%; font: 16px/1.4 var(--body); color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { min-height: 84px; resize: vertical; }
textarea:focus, input.text:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px rgba(152, 31, 31, .15); }
.row2 { display: grid; gap: 14px; }
.next { display: flex; justify-content: flex-end; margin: 4px 0 0; }
.btn { font: 600 16px var(--body); border: 0; border-radius: 12px; padding: 14px 20px; cursor: pointer; min-height: 50px; }
.btn.primary { background: var(--red); color: #fff; width: 100%; }
.btn.primary:hover { background: var(--red-dark); }
.btn.primary:disabled { opacity: .7; cursor: progress; }
.btn.ghost { background: var(--paper); color: var(--red); border: 1.5px solid var(--line); }
.sendbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: rgba(248, 239, 232, .96); backdrop-filter: blur(6px);
  border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.sendbar .in { max-width: 640px; margin: 0 auto; display: grid; gap: 6px; }
.sendbar .status { font-size: 13px; color: var(--muted); text-align: center; min-height: 18px; }
.sendbar .status.err { color: var(--red); font-weight: 500; }
.done { text-align: center; padding: 22px 4px 4px; }
.done .check { width: 64px; height: 64px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; margin: 0 auto 10px; }
.done h2 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 6px 0; }
.recap { text-align: left; }
.recap h3 { font-family: var(--display); font-weight: 400; font-size: 19px; margin: 0 0 8px; }
.recap dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 15px; }
.recap dt { color: var(--muted); }
.recap dd { margin: 0; white-space: pre-line; }
footer { text-align: center; color: var(--muted); font-size: 13px; padding: 26px 0 0; }
footer img { width: 64px; opacity: .9; }
footer a { color: var(--red); }
.skeleton { padding: 40px 0; text-align: center; color: var(--muted); }
.spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--red); border-radius: 50%; margin: 0 auto 12px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
@media (min-width: 560px) {
  .wrap { padding-bottom: 150px; }
  section.card { padding: 22px 22px; }
  .row2 { grid-template-columns: 1fr 1fr; }
  .opts.two { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><img src="logo.png" alt="Merzbacher's of Germantown" width="720" height="302"></header>
  <main id="app" aria-live="polite">
    <div class="skeleton" id="loading"><div class="spin" aria-hidden="true"></div>Getting your Thanksgiving week ready…</div>
  </main>
  <footer id="foot" hidden></footer>
</div>
<div class="sendbar" id="sendbar" hidden>
  <div class="in">
    <button class="btn primary" id="send" type="button">Send to Merzbacher's</button>
    <div class="status" id="status" role="status"></div>
  </div>
</div>
<script>
"use strict";
(function () {
  var API = "https://script.google.com/macros/s/AKfycbyPDGZci4_wQu9qnkBh8wrupdvNjt5pP19Iyevu9-na951f_uSX-LBOV5sgmnMlufsQIg/exec";
  var qs = new URLSearchParams(location.search);
  var LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  if (LOCAL && qs.get("api")) API = qs.get("api");
  var TOKEN = (qs.get("t") || "").trim();
  var NOW_OVERRIDE = qs.get("now");                       // honored by the server only on test pages
  var app = document.getElementById("app"), bar = document.getElementById("sendbar"), statusEl = document.getElementById("status");
  var sendBtn = document.getElementById("send"), foot = document.getElementById("foot");
  var P, saved = null, savedAt = null, state, serverNow, loadedAt, view = "form", current = 0, sending = false, pendingSid = null;

  // ---------- helpers ----------
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") e.textContent = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] === true) e.setAttribute(k, "");
      else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function now() { return new Date(serverNow.getTime() + (Date.now() - loadedAt)); }
  function money(x) { return "$" + (Math.round(x * 100) / 100).toFixed(2); }
  function fmtDeadline(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString("en-US", {weekday: "short", month: "numeric", day: "numeric", timeZone: "America/New_York"}).replace(",", "") +
      ", " + d.toLocaleTimeString("en-US", {hour: "numeric", minute: "2-digit", timeZone: "America/New_York"}).replace(":00", "");
  }
  function dayLabel(store, d) { for (var i = 0; i < store.days.length; i++) if (store.days[i].d === d) return store.days[i].label; return d; }
  function plural(n, one, many) { return n === 1 ? one : many; }
  function closedAll() { return now() >= new Date(P.deadlines.all); }
  function closedRolls() { return now() >= new Date(P.deadlines.rolls); }
  function sampleOpen(day) { return now() < new Date(day.cutoff); }
  function storeKey(s) { return String(s.aid); }
  function itemQty(s, it, d) { var q = state.stores[storeKey(s)].qty[it.k] || {}; return q[d] != null ? q[d] : (it.standing[d] || 0); }
  function lsKey() { return "merz-thanksgiving-" + TOKEN; }
  function saveDraft() { try { localStorage.setItem(lsKey(), JSON.stringify({base: savedAt || null, state: state, at: Date.now()})); } catch (e) {} }
  function readDraft() { try { return JSON.parse(localStorage.getItem(lsKey()) || "null"); } catch (e) { return null; } }
  function dropDraft() { try { localStorage.removeItem(lsKey()); } catch (e) {} }
  function sid() { var a = new Uint8Array(8); (window.crypto || window.msCrypto).getRandomValues(a); return Array.prototype.map.call(a, function (b) { return ("0" + b.toString(16)).slice(-2); }).join(""); }

  function blankState() {
    var st = {name: (P.greeting && P.greeting !== "there" && P.greeting.indexOf(" and ") < 0 && P.greeting.indexOf(",") < 0) ? P.greeting : "", note: "", stores: {}};
    P.stores.forEach(function (s) {
      var o = {thu: null, qty: {}, sample: null, extraDays: []};
      s.items.forEach(function (it) { o.qty[it.k] = {}; it.days.forEach(function (d) { o.qty[it.k][d] = it.standing[d] || 0; }); });
      st.stores[storeKey(s)] = o;
    });
    return st;
  }
  function fromSaved(a) {
    var st = blankState();
    st.name = a.name || st.name; st.note = a.note || "";
    P.stores.forEach(function (s) {
      var got = (a.stores || {})[storeKey(s)], o = st.stores[storeKey(s)];
      if (!got) return;
      o.thu = got.thu || null; o.sample = got.sample || null;
      s.items.forEach(function (it) { var q = (got.qty || {})[it.k] || {}; it.days.forEach(function (d) { if (q[d] != null) o.qty[it.k][d] = q[d]; }); });
    });
    return st;
  }

  // ---------- load ----------
  function load() {
    if (!/^[A-Za-z0-9]{10,32}$/.test(TOKEN)) return fatal("This link isn't complete.", "Open the link from Matt's email again, or just reply to the email.");
    var url = API + "?t=" + encodeURIComponent(TOKEN) + (NOW_OVERRIDE ? "&now=" + encodeURIComponent(NOW_OVERRIDE) : "");
    fetchJSON(url, {method: "GET"}, 25000).then(function (r) {
      if (!r.ok) return fatal(r.code === "bad_link" ? "This link isn't working." : "We couldn't open your page.",
        r.code === "bad_link" ? "Reply to Matt's email instead, or call " + phone() + "." : "Please try again in a minute.", r.code !== "bad_link");
      P = r.page; saved = r.saved; savedAt = r.saved_at; serverNow = new Date(r.now); loadedAt = Date.now();
      document.title = "Thanksgiving week · " + P.title;
      state = saved ? fromSaved(saved) : blankState();
      var dr = readDraft();
      var restored = false;
      if (dr && dr.state && dr.base === (savedAt || null) && dr.state.stores && Object.keys(dr.state.stores).length === P.stores.length) {
        state = dr.state; restored = true;
        P.stores.forEach(function (s) { if (!state.stores[storeKey(s)]) state = blankState(); });
      }
      renderFoot();
      if (closedAll()) { view = "closed"; render(); return; }
      view = "form"; render(restored);
    }).catch(function () {
      fatal("We couldn't reach Merzbacher's.", "Check your connection and try again.", true);
    });
  }
  function fetchJSON(url, opt, ms) {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, ms);
    if (ctl) opt.signal = ctl.signal;
    opt.redirect = "follow"; opt.credentials = "omit"; opt.cache = "no-store";
    return fetch(url, opt).then(function (res) { clearTimeout(timer); if (!res.ok) throw new Error("http " + res.status); return res.json(); },
      function (e) { clearTimeout(timer); throw e; });
  }
  function phone() { return (P && P.contact && P.contact.phone) || "215-298-9141"; }
  function fatal(title, msg, retry) {
    bar.hidden = true;
    app.innerHTML = "";
    app.appendChild(el("div", {class: "hello"}, [
      el("h1", {text: title}), el("p", {text: msg}),
      retry ? el("p", {}, [el("button", {class: "btn ghost", type: "button", style: "margin-top:16px", onclick: function () { location.reload(); }, text: "Try again"})]) : null
    ]));
    renderFoot();
  }
  function renderFoot() {
    foot.hidden = false; foot.innerHTML = "";
    foot.appendChild(el("p", {}, ["Questions? Call ", el("a", {href: "tel:+12152989141", text: phone()}), " or just reply to Matt's email."]));
    foot.appendChild(el("p", {}, ["Merzbacher's · Bread to share · Germantown, Philadelphia"]));
  }

  // ---------- render ----------
  function render(restored) {
    app.innerHTML = "";
    if (view === "done") return renderDone();
    if (view === "closed") return renderClosed();
    bar.hidden = false;
    var multi = P.stores.length > 1;
    var steps = Math.max.apply(null, P.stores.map(function (s) {
      return 1 + (s.thursday ? 1 : 0) + (s.samples && (s.samples.days.some(sampleOpen) || state.stores[storeKey(s)].sample) ? 1 : 0);
    }));
    var count = ["", "One quick thing", "Two quick things", "Three quick things"][steps];
    var hello = el("div", {class: "hello"}, [
      el("div", {class: "eyebrow", text: "Thanksgiving week · Nov 22 – 28"}),
      el("h1", {text: "Hi " + P.greeting + "."}),
      el("p", {text: multi ? count + " per store for Thanksgiving week. A minute or two and you're done."
                           : count + " for " + possessive(P.title) + " Thanksgiving week. About a minute and you're done."})
    ]);
    app.appendChild(hello);
    var dues = el("div", {class: "dues"});
    var due = el("span", {class: "due"}, ["Order by ", el("b", {text: fmtDeadline(P.deadlines.all)})]);
    if (!closedRolls()) { due.appendChild(document.createTextNode(" · rolls by ")); due.appendChild(el("b", {text: fmtDeadline(P.deadlines.rolls)})); }
    dues.appendChild(due);
    app.appendChild(dues);
    if (savedAt) app.appendChild(el("div", {class: "banner", text: "We got your answers " + savedAt + ". Change anything below and send again."}));
    if (restored) app.appendChild(el("div", {class: "banner warn", text: "We kept what you were filling in. Send it when you're ready."}));
    if (multi) {
      var nav = el("nav", {class: "stores", "aria-label": "Stores on this page"});
      P.stores.forEach(function (s, i) {
        nav.appendChild(el("button", {type: "button", "aria-current": i === current ? "true" : "false", "data-i": i,
          onclick: function () { show(i, true); }}, [s.short || s.name, el("span", {class: "ok", "aria-hidden": "true", text: storeDone(s) ? "✓" : ""})]));
      });
      app.appendChild(nav);
    }
    P.stores.forEach(function (s, i) { app.appendChild(renderStore(s, i, multi)); });
    app.appendChild(renderExtras());
    updateStatus();
  }
  function possessive(t) { return /s$/i.test(t) && !/'s$/.test(t) ? t + "'" : t + "'s"; }
  function joinList(a) { return a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1]; }
  function storeDone(s) { return !s.thursday || !!state.stores[storeKey(s)].thu; }
  function show(i, scroll) {
    current = i;
    document.querySelectorAll("[data-store]").forEach(function (x) { x.hidden = Number(x.getAttribute("data-store")) !== i; });
    document.querySelectorAll("nav.stores button").forEach(function (b) { b.setAttribute("aria-current", Number(b.getAttribute("data-i")) === i ? "true" : "false"); });
    var b = document.querySelector('nav.stores button[data-i="' + i + '"]'); if (b && b.scrollIntoView) b.scrollIntoView({block: "nearest", inline: "center"});
    if (scroll) { var top = document.querySelector("nav.stores"); if (top) window.scrollTo({top: top.offsetTop - 4, behavior: "smooth"}); }
  }
  function refreshTabs() {
    document.querySelectorAll("nav.stores button").forEach(function (b) {
      var s = P.stores[Number(b.getAttribute("data-i"))]; b.querySelector(".ok").textContent = storeDone(s) ? "✓" : "";
    });
  }

  function renderStore(s, i, multi) {
    var box = el("div", {"data-store": i, hidden: multi && i !== current});
    if (multi) box.appendChild(el("div", {class: "store-name", text: s.name}));
    var step = 1;
    if (s.thursday) box.appendChild(renderThursday(s, step++));
    box.appendChild(renderGrid(s, step++));
    var openSamples = s.samples && (s.samples.days.some(sampleOpen) || state.stores[storeKey(s)].sample);
    if (openSamples) box.appendChild(renderSamples(s, step++));
    if (multi && i < P.stores.length - 1) {
      box.appendChild(el("div", {class: "next"}, [el("button", {class: "btn ghost", type: "button", onclick: function () { show(i + 1, true); },
        text: "Next: " + P.stores[i + 1].name + " →"})]));
    }
    return box;
  }

  function renderThursday(s, n) {
    var o = state.stores[storeKey(s)];
    var card = el("section", {class: "card", id: "thu-" + s.aid});
    card.appendChild(stepHead(n, "Your Thursday order"));
    card.appendChild(el("p", {class: "sub", text: "No regular " + (s.pickup ? "pickups" : "deliveries") + " on Thanksgiving Day, Thu 11/26. Tell us where this order goes, or we'll skip it that week."}));
    card.appendChild(el("div", {class: "usual"}, [el("b", {text: s.pickup ? "You usually pick up" : "You usually get"}), s.thursday.usual]));
    var fs = el("fieldset", {}, [el("legend", {text: s.pickup ? "When do you want to pick it up?" : "Where should it go?"})]);
    var opts = el("div", {class: "opts" + (s.thursday.options.length === 4 ? " two" : "")});
    s.thursday.options.forEach(function (op) {
      var id = "thu-" + s.aid + "-" + op.k;
      var input = el("input", {type: "radio", name: "thu-" + s.aid, id: id, value: op.k});
      input.checked = o.thu === op.k;
      input.addEventListener("change", function () {
        o.thu = op.k; card.classList.remove("attn");
        toggleThuRow(s); saveDraft(); refreshTabs(); updateStatus();
      });
      var wd = op.date ? new Date(op.date + "T12:00:00").toLocaleDateString("en-US", {weekday: "long"}) : "";
      var sub = op.k === "thu" ? "One small run Thanksgiving morning" : (op.k === "skip" ? "No Thursday bread that week" :
        (s.pickup ? "Same pickup spot" : (hasUsual(s, op.date) ? "With your usual " + wd + " delivery" : "A " + wd + " delivery just for this")));
      var title = op.k === "thu" ? "Keep it on Thursday" : op.label;
      opts.appendChild(el("label", {class: "opt", for: id}, [input, el("span", {class: "dot", "aria-hidden": "true"}), el("span", {}, [el("span", {class: "t", text: title}), el("span", {class: "s", text: sub})])]));
    });
    fs.appendChild(opts); card.appendChild(fs);
    return card;
  }
  function hasUsual(s, iso) { return s.days.some(function (d) { return d.d === iso && d.usual; }); }
  function stepHead(n, title) { return el("div", {class: "step"}, [el("span", {class: "n", "aria-hidden": "true", text: n}), el("h2", {text: title})]); }

  function rowVisible(s, day) {
    var o = state.stores[storeKey(s)];
    if (day.d === "2026-11-26") return o.thu === "thu";
    if (day.usual) return true;
    if (o.extraDays.indexOf(day.d) >= 0) return true;
    return s.items.some(function (it) { return itemQty(s, it, day.d) !== (it.standing[day.d] || 0); });
  }
  function renderGrid(s, n) {
    var o = state.stores[storeKey(s)];
    var card = el("section", {class: "card", id: "grid-" + s.aid});
    card.appendChild(stepHead(n, "Holiday squash & rolls"));
    card.appendChild(el("p", {class: "sub", text: "How many do you want each day? We filled in what's already on your standing order. Change any number."}));
    var tbl = el("table", {class: "grid"});
    var hr = el("tr", {}, [el("th", {class: "day", scope: "col"}, [el("span", {class: "sr", text: "Day"})])]);
    s.items.forEach(function (it) {
      var short = it.k === "squash" ? "Squash sourdough" : (it.k === "gh" ? "Garlic & Herb rolls" : "Sweet Potato rolls");
      hr.appendChild(el("th", {scope: "col"}, [short, el("small", {text: money(it.price) + (it.per === "dozen" ? " / dz" : " / loaf")})]));
    });
    tbl.appendChild(el("thead", {}, [hr]));
    var tb = el("tbody");
    var rollsShut = closedRolls();
    s.days.forEach(function (day) {
      var tr = el("tr", {"data-day": day.d});
      tr.hidden = !rowVisible(s, day);
      tr.appendChild(el("td", {class: "day"}, [day.label.slice(0, 3), el("small", {text: day.label.slice(4)})]));
      s.items.forEach(function (it) {
        var td = el("td");
        if (it.days.indexOf(day.d) < 0) {
          td.appendChild(el("span", {class: "na", title: it.name + " isn't baked for " + day.label, "aria-label": it.name + " not available " + day.label, text: "–"}));
        } else {
          var base = it.standing[day.d] || 0, v = itemQty(s, it, day.d);
          var inp = el("input", {class: "qty" + (v !== base ? " changed" : ""), type: "text", inputmode: "numeric", pattern: "[0-9]*", maxlength: "3",
            autocomplete: "off", "aria-label": it.name + ", " + day.label + (it.per === "dozen" ? " (dozens)" : " (loaves)"),
            placeholder: "0", value: v ? String(v) : ""});
          if (it.roll && rollsShut) inp.disabled = true;
          inp.addEventListener("focus", function () { setTimeout(function () { try { inp.select(); } catch (e) {} }, 0); });
          inp.addEventListener("input", function () {
            var clean = inp.value.replace(/\D/g, "").slice(0, 3);
            if (clean !== inp.value) inp.value = clean;
            var q = clean === "" ? 0 : Math.min(500, parseInt(clean, 10));
            o.qty[it.k][day.d] = q;
            inp.classList.toggle("changed", q !== base);
            was.textContent = q !== base && base ? "was " + base : "";
            updateTotal(s); saveDraft(); updateStatus();
          });
          var was = el("span", {class: "was", "aria-hidden": "true", text: v !== base && base ? "was " + base : ""});
          td.appendChild(inp); td.appendChild(was);
        }
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);
    card.appendChild(el("div", {class: "grid-wrap"}, [tbl]));
    var hiddenDays = s.days.filter(function (d) { return d.d !== "2026-11-26" && !rowVisible(s, d); });
    if (hiddenDays.length) {
      var add = el("div", {class: "addday"});
      var list = el("div", {class: "dayadd", hidden: true});
      hiddenDays.forEach(function (d) {
        list.appendChild(el("button", {type: "button", class: "chip", text: "+ " + d.label, onclick: function (ev) {
          o.extraDays.push(d.d); tbl.querySelector('tr[data-day="' + d.d + '"]').hidden = false; ev.currentTarget.remove();
          if (!list.children.length) add.remove(); saveDraft();
          var first = tbl.querySelector('tr[data-day="' + d.d + '"] input'); if (first) first.focus();
        }}));
      });
      add.appendChild(el("button", {type: "button", class: "linkbtn", text: "Add a day you don't usually get a delivery", onclick: function (ev) { list.hidden = false; ev.currentTarget.remove(); }}));
      add.appendChild(list);
      card.appendChild(add);
    }
    var squashDays = (s.items.filter(function (i) { return i.k === "squash"; })[0] || {}).days || [];
    if (squashDays.length && squashDays.length < s.days.length) card.appendChild(el("p", {class: "note", text: "Squash sourdough is baked for Mon, Wed, Fri and Sat deliveries."}));
    if (rollsShut) card.appendChild(el("p", {class: "note", text: "Roll orders closed " + fmtDeadline(P.deadlines.rolls) + ". Call " + phone() + " and we'll try."}));
    card.appendChild(el("div", {class: "total", id: "total-" + s.aid, hidden: true}));
    if (s.last_year) {
      var ly = [];
      if (s.last_year.gh) ly.push(s.last_year.gh + " dz Garlic & Herb rolls");
      if (s.last_year.sp) ly.push(s.last_year.sp + " dz Sweet Potato rolls");
      if (s.last_year.squash) ly.push(s.last_year.squash + " butternut sourdough loaves");
      if (ly.length) card.appendChild(el("p", {class: "lastyear"}, [el("b", {text: "Last Thanksgiving week "}), (P.stores.length > 1 ? "this store" : "you") + " took " + joinList(ly) + "."]));
    }
    setTimeout(function () { updateTotal(s); }, 0);
    return card;
  }
  function toggleThuRow(s) {
    var tr = document.querySelector('#grid-' + s.aid + ' tr[data-day="2026-11-26"]');
    var o = state.stores[storeKey(s)];
    if (!tr) return;
    tr.hidden = o.thu !== "thu";
    if (o.thu !== "thu") {                                   // numbers typed for a Thursday that is no longer happening go back
      s.items.forEach(function (it) { if (it.days.indexOf("2026-11-26") >= 0) o.qty[it.k]["2026-11-26"] = it.standing["2026-11-26"] || 0; });
      tr.querySelectorAll("input").forEach(function (inp, j) { inp.value = ""; inp.classList.remove("changed"); });
      tr.querySelectorAll(".was").forEach(function (w) { w.textContent = ""; });
      updateTotal(s);
    }
  }
  function delta(s) {
    var add = 0, items = {};
    s.items.forEach(function (it) {
      var n = 0;
      it.days.forEach(function (d) { n += itemQty(s, it, d) - (it.standing[d] || 0); });
      items[it.k] = n; add += n * it.price;
    });
    return {money: add, items: items};
  }
  function updateTotal(s) {
    var box = document.getElementById("total-" + s.aid); if (!box) return;
    var d = delta(s), parts = [];
    s.items.forEach(function (it) {
      var n = d.items[it.k]; if (!n) return;
      var m = Math.abs(n), more = n > 0 ? "more" : (it.k === "squash" ? "fewer" : "less");
      parts.push(it.k === "squash" ? m + " " + more + " squash " + plural(m, "loaf", "loaves")
        : m + " " + (n > 0 ? "more" : "fewer") + " " + plural(m, "dozen", "dozen") + " " + (it.k === "gh" ? "Garlic & Herb" : "Sweet Potato"));
    });
    if (!parts.length) { box.hidden = true; return; }
    box.hidden = false;
    box.textContent = "That's " + joinList(parts) + ": " + money(Math.abs(d.money)) + (d.money >= 0 ? " added to" : " off") + " the week.";
  }

  function renderSamples(s, n) {
    var o = state.stores[storeKey(s)];
    var card = el("section", {class: "card", id: "smp-" + s.aid});
    card.appendChild(stepHead(n, "Free roll samples"));
    card.appendChild(el("p", {class: "sub", text: "Want to taste the rolls first? We'll send a dozen of each, free, with " + (s.pickup ? "a pickup" : "a delivery") + ". Pick a day:"}));
    var chips = el("div", {class: "chips", role: "group", "aria-label": "Sample day"});
    var opts = s.samples.days.map(function (d) { return {k: d.d, label: d.label, open: sampleOpen(d)}; }).concat([{k: "no", label: "No thanks", open: true}]);
    opts.forEach(function (op) {
      var b = el("button", {type: "button", class: "chip", "aria-pressed": o.sample === op.k ? "true" : "false", text: op.label});
      if (!op.open && o.sample !== op.k) { b.disabled = true; b.title = "Too soon for this day now"; }
      if (!op.open && o.sample === op.k) { b.disabled = true; b.textContent = op.label + " (set)"; }
      b.addEventListener("click", function () {
        o.sample = o.sample === op.k ? null : op.k;
        chips.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", "false"); });
        if (o.sample) b.setAttribute("aria-pressed", "true");
        saveDraft(); updateStatus();
      });
      chips.appendChild(b);
    });
    card.appendChild(chips);
    return card;
  }

  function renderExtras() {
    var card = el("section", {class: "card"});
    var note = el("textarea", {id: "note", maxlength: "1500", placeholder: "Like: double the baguettes on Wednesday"});
    note.value = state.note || "";
    note.addEventListener("input", function () { state.note = note.value; saveDraft(); });
    var name = el("input", {class: "text", id: "name", maxlength: "80", autocomplete: "name", placeholder: "So Matt knows who answered"});
    name.value = state.name || "";
    name.addEventListener("input", function () { state.name = name.value; saveDraft(); });
    card.appendChild(el("div", {class: "row2"}, [
      el("div", {}, [el("label", {class: "field", for: "note", text: "Anything else for Thanksgiving week?"}), note]),
      el("div", {}, [el("label", {class: "field", for: "name", text: "Your name"}), name])
    ]));
    return card;
  }

  function changeCount() {
    var n = 0;
    P.stores.forEach(function (s) {
      var o = state.stores[storeKey(s)];
      if (o.thu) n++; if (o.sample) n++;
      s.items.forEach(function (it) { it.days.forEach(function (d) { if (itemQty(s, it, d) !== (it.standing[d] || 0)) n++; }); });
    });
    return n;
  }
  function updateStatus(msg, isErr) {
    if (view !== "form") return;
    statusEl.classList.toggle("err", !!isErr);
    if (msg) { statusEl.textContent = msg; return; }
    var missing = P.stores.filter(function (s) { return !storeDone(s); });
    if (missing.length) statusEl.textContent = (P.stores.length > 1 ? "Still to answer: Thursday for " + joinList(missing.map(function (s) { return s.short || s.name; })) : "Still to answer: where your Thursday order goes");
    else statusEl.textContent = changeCount() ? "Ready to send." : "Nothing changed yet. Sending now tells us you're all set.";
  }

  // ---------- send ----------
  function payload() {
    var out = {t: TOKEN, sid: pendingSid, name: state.name || "", note: state.note || "", stores: {}};
    P.stores.forEach(function (s) {
      var o = state.stores[storeKey(s)], q = {};
      s.items.forEach(function (it) { q[it.k] = {}; it.days.forEach(function (d) { q[it.k][d] = itemQty(s, it, d); }); });
      out.stores[storeKey(s)] = {thu: o.thu, qty: q, sample: o.sample};
    });
    return out;
  }
  sendBtn.addEventListener("click", function () {
    if (sending) return;
    var missing = P.stores.filter(function (s) { return !storeDone(s); });
    if (missing.length) {
      var i = P.stores.indexOf(missing[0]);
      if (P.stores.length > 1) show(i, false);
      var card = document.getElementById("thu-" + missing[0].aid);
      card.classList.add("attn");
      card.scrollIntoView({behavior: "smooth", block: "center"});
      updateStatus("Pick where " + (P.stores.length > 1 ? possessive(missing[0].short || missing[0].name) : "your") + " Thursday order goes, then send.", true);
      return;
    }
    if (closedAll()) { view = "closed"; render(); return; }
    sending = true; sendBtn.disabled = true; sendBtn.textContent = "Sending…"; updateStatus(" ");
    if (!pendingSid) pendingSid = sid();
    var body = JSON.stringify(payload());
    fetchJSON(API + (NOW_OVERRIDE ? "?now=" + encodeURIComponent(NOW_OVERRIDE) : ""), {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: body}, 45000)
      .then(function (r) {
        sending = false; sendBtn.disabled = false; sendBtn.textContent = "Send to Merzbacher's";
        if (!r.ok) {
          if (r.code === "closed") { view = "closed"; render(); return; }
          pendingSid = null;
          updateStatus(r.error || "That didn't go through. Please try again.", true);
          return;
        }
        pendingSid = null; saved = r.saved; savedAt = r.saved_at; dropDraft();
        state = fromSaved(saved);
        view = "done"; render(); window.scrollTo({top: 0, behavior: "smooth"});
      })
      .catch(function () {
        sending = false; sendBtn.disabled = false; sendBtn.textContent = "Send again";
        updateStatus("It didn't send. Check your connection and tap Send again. Nothing you typed is lost.", true);
      });
  });

  // ---------- after sending / closed ----------
  function lines(s, a) {
    var o = (a.stores || {})[storeKey(s)] || {qty: {}}, out = [];
    if (s.thursday) {
      var op = s.thursday.options.filter(function (x) { return x.k === o.thu; })[0];
      out.push(["Thursday order", op ? op.short.replace("Moved to", "Moving to").replace("Skip", "Skipping it") : "Cancelled (no answer)"]);
    }
    s.items.forEach(function (it) {
      var bits = [];
      it.days.forEach(function (d) {
        var q = ((o.qty || {})[it.k] || {})[d]; if (q == null) q = it.standing[d] || 0;
        if (q) bits.push(dayLabel(s, d) + ": " + q);
      });
      out.push([it.k === "squash" ? "Squash sourdough" : (it.k === "gh" ? "Garlic & Herb (dz)" : "Sweet Potato (dz)"), bits.length ? bits.join("\n") : "None"]);
    });
    if (s.samples) {
      var sd = s.samples.days.filter(function (x) { return x.d === o.sample; })[0];
      out.push(["Free samples", o.sample === "no" ? "No thanks" : (sd ? sd.label : "Not this time")]);
    }
    return out;
  }
  function recap(a) {
    var box = el("section", {class: "card recap"});
    P.stores.forEach(function (s, i) {
      if (P.stores.length > 1) box.appendChild(el("h3", {text: s.name, style: i ? "margin-top:18px" : ""}));
      var dl = el("dl");
      lines(s, a).forEach(function (l) { dl.appendChild(el("dt", {text: l[0]})); dl.appendChild(el("dd", {text: l[1]})); });
      box.appendChild(dl);
    });
    if (a.note) box.appendChild(el("p", {class: "note", text: "Your note: " + a.note}));
    return box;
  }
  function renderDone() {
    bar.hidden = true;
    var who = (state.name || "").trim().split(/\s+/)[0] || (P.greeting !== "there" && P.greeting.indexOf(" and ") < 0 ? P.greeting : "");
    app.appendChild(el("div", {class: "done"}, [
      el("div", {class: "check", "aria-hidden": "true", html: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'}),
      el("h2", {text: "Got it" + (who ? ", " + who : "") + "."}),
      el("p", {class: "sub", text: "We'll put it in, and you'll get our usual order confirmation email. Here's what we have:"})
    ]));
    app.appendChild(recap(saved));
    app.appendChild(el("p", {class: "note", style: "text-align:center", text: "Need to change something? Use this same link until " + fmtDeadline(P.deadlines.all) + "."}));
    app.appendChild(el("p", {style: "text-align:center;margin-top:14px"}, [el("button", {class: "btn ghost", type: "button", text: "Change something", onclick: function () { view = "form"; render(); window.scrollTo({top: 0}); }})]));
  }
  function renderClosed() {
    bar.hidden = true;
    app.appendChild(el("div", {class: "hello"}, [
      el("div", {class: "eyebrow", text: "Thanksgiving week · Nov 22 – 28"}),
      el("h1", {text: "Thanksgiving orders are closed."}),
      el("p", {text: "They closed " + fmtDeadline(P.deadlines.all) + ". Need a change? Call Matt at " + phone() + "."})
    ]));
    if (saved) { app.appendChild(el("p", {class: "sub", style: "text-align:center", text: "What we have from you:"})); app.appendChild(recap(saved)); }
  }

  load();
})();
</script>
</body>
</html>
